# The RabbitMQ material: one folder per kind of output (RULES.md, Project
# structure). Sources sit in md/; si build writes everything else.
structure:
  rabbitmq/
    md/           markdown
    slides/       deck
      pdf/        deck:pdf
    labs/         lab
    html/         site
      images/     image
      animations/ animation
      pdfs/       deck:pdf
    videos/       video
    dist/         html/:zip, deck:zip
