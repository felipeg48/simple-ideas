<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Lamp shop</title>
<style>
  body { margin: 0; padding: 1.2rem 1.4rem; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #2a2433 }
  h1 { font-size: 1.3rem; margin: 0 0 .8rem }
  label { display: block; margin-bottom: .8rem }
  input { font: inherit; width: 4em; margin-left: .5em }
  button { font: inherit; font-weight: 700; padding: .5em 1.4em; border: 0; border-radius: .4em; background: #6236c9; color: #fff; cursor: pointer }
  #done { font-weight: 700; color: #1f6b4f }
</style>
<h1>Desk lamp, two shades</h1>
<label>Quantity <input id="qty" type="number" min="1" value="1"></label>
<button>Buy</button>
<p id="done" role="status"></p>
<script>
  document.querySelector('button').onclick = function () {
    document.getElementById('done').textContent = 'Bought ' + document.getElementById('qty').value + ': in the queue, leaves at 15:00';
  };
</script>
