<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Shop</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</head>
<body>
<header class="bar"><span class="brand">Northwind Shop</span><span class="muted">Coffee, tea and the things around them</span></header>
<main>
  <h1>Sign in</h1>
  <form id="signin" class="card">
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <p id="signin-error" class="error" role="alert"></p>
    <button type="submit">Sign in</button>
  </form>
</main>
<script>signIn();</script>
</body>
</html>
