<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleprompter · __TITLE__</title>
<style>
__CSS__
body{overflow:hidden;height:100%}
.pv{--pv-size:1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(.5rem,1vw,.9rem);
  height:100vh;height:100dvh;padding:clamp(.5rem,1vw,.9rem);font-family:var(--si-font-body);color:var(--si-fg);background:var(--si-bg)}
.pv-top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:.3rem 1.4rem;font-family:var(--si-font-mono);font-size:clamp(12px,.55vw + 8px,17px);color:var(--si-muted)}
.pv-top b{color:var(--si-fg);font-family:var(--si-font-body);font-size:1.2em;font-weight:700}
.pv-clocks{margin-left:auto;display:flex;flex-wrap:wrap;gap:.3rem 1.2rem;align-items:baseline}
.pv-clocks strong{font-size:1.5em;color:var(--si-fg);font-variant-numeric:tabular-nums}
.pv-clocks .over strong{color:var(--si-warn)}.pv-clocks .late strong{color:var(--si-crit)}
.pv-clocks .pace{color:var(--si-muted)}
.pv-prompt{position:relative;min-height:0;display:flex;flex-direction:column;border:1px solid var(--si-line);border-radius:.7rem;background:var(--si-surface);overflow:hidden}
.pv-prompt-head{display:flex;justify-content:space-between;gap:1rem;padding:.45rem .9rem;font-family:var(--si-font-mono);font-size:.8rem;color:var(--si-muted);border-bottom:1px solid var(--si-line)}
.pv-notes{flex:1 1 auto;overflow-y:auto;padding:1.2rem 1.4rem 45vh;font-size:calc(clamp(1.35rem,1.7vw + .6rem,3.2rem) * var(--pv-size));line-height:1.5;scroll-behavior:auto}
.pv-notes p{margin:0 0 .75em}.pv-notes ul,.pv-notes ol{padding-left:1.2em;margin:0 0 .75em}.pv-notes li{margin:.25em 0}
.pv-notes code{font-size:.85em}
.pv-notes strong{color:var(--si-accent)}
.pv-notes .si-cue{display:inline-block;margin:0 .2em;padding:.05em .55em .1em;border-radius:.35em;font:700 .62em/1.4 var(--si-font-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--si-on-accent);background:var(--si-accent);vertical-align:.18em}
.pv-notes .si-cue::before{content:"\25B6\00a0"}
.pv-notes[hidden]{display:none}
/* two presenters (speakers:): your script in full, the others as one quiet cue line */
.pv-who{font-family:var(--si-font-mono);font-size:.5em;color:var(--si-accent);margin:.4em 0 .2em}
.pv-other{color:var(--si-muted);font-size:.6em;line-height:1.4;margin:0 0 .9em;padding:.2em .6em;border-left:3px solid var(--si-line)}
.pv-other b{color:var(--si-accent);font-family:var(--si-font-mono);font-weight:700;margin-right:.4em}
.pv-other.is-now{border-left-color:var(--si-accent)}
.pv-handover{position:absolute;top:2.4rem;right:1rem;z-index:1;padding:.3em .8em;border-radius:.5em;background:var(--si-accent);color:var(--si-on-accent);font:700 clamp(1rem,1.2vw + .5rem,1.8rem) var(--si-font-mono);opacity:0;transition:opacity .3s;pointer-events:none}
.pv-handover.on{opacity:1}
.pv-bar select{font:inherit;color:var(--si-fg);background:var(--si-surface);border:1px solid var(--si-line);border-radius:.45rem;padding:.35em .5em}
.pv-bar button:disabled{opacity:.4;cursor:not-allowed}
.pv-tabs{display:flex;gap:.3rem;margin-right:auto}
.pv-tab{font:inherit;font-family:var(--si-font-mono);font-size:.78rem;color:var(--si-muted);background:none;border:1px solid transparent;border-radius:.4rem;padding:.2em .7em;cursor:pointer}
.pv-tab:hover{color:var(--si-fg)}
.pv-tab[aria-pressed="true"]{color:var(--si-on-accent);background:var(--si-accent)}
.pv-points{flex:1 1 auto;overflow-y:auto;padding:1.2rem 1.4rem 10vh;font-size:calc(clamp(1.15rem,1.2vw + .5rem,2.4rem) * var(--pv-size));line-height:1.55}
.pv-points[hidden]{display:none}
.pv-qa{flex:1 1 auto;overflow-y:auto;padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.7rem;font-size:calc(1.05rem * var(--pv-size))}
.pv-qa[hidden]{display:none}
.pv-q{border:1px solid var(--si-line);border-radius:.6rem;padding:.7rem .9rem;background:var(--si-bg)}
.pv-q[data-state="shown"]{border-color:var(--si-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--si-accent) 30%,transparent)}
.pv-q[data-state="answered"]{opacity:.55}
.pv-q p{margin:0 0 .5rem;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.pv-q small{display:block;margin-bottom:.5rem;color:var(--si-muted);font-family:var(--si-font-mono);font-size:.75rem}
.pv-q button{font:inherit;font-size:.85rem;color:var(--si-fg);background:var(--si-surface);border:1px solid var(--si-line);border-radius:.45rem;padding:.3em .7em;margin-right:.3rem;cursor:pointer}
.pv-q button:hover{border-color:var(--si-accent)}
.pv-words small{display:block;margin-bottom:.4rem}
.pv-words button{margin:.15rem}
.pv-words button[aria-pressed=true]{opacity:.55;text-decoration:line-through}
.pv-points p{margin:0 0 .6em}
.pv-points ul,.pv-points ol{padding-left:1.3em;margin:0 0 .6em}.pv-points li{margin:.45em 0}
.pv-points code{font-size:.85em}.pv-points strong{color:var(--si-accent)}
.pv-rehearse{color:var(--si-muted);font-variant-numeric:tabular-nums;opacity:.85}
.pv-prompt.points::after{display:none}
.pv-prompt::after{content:"";position:absolute;left:0;right:0;top:34%;height:0;border-top:2px dashed color-mix(in srgb,var(--si-accent) 45%,transparent);pointer-events:none}
.pv.mirror .pv-notes{transform:scaleX(-1)}
.pv-side{min-height:0;display:flex;flex-direction:column;gap:.5rem;overflow:auto}
.pv-label{font-family:var(--si-font-mono);font-size:.78rem;color:var(--si-muted)}
.pv-screen{position:relative;width:100%;aspect-ratio:var(--_aspect,16/9);flex:none;border:1px solid var(--si-line);border-radius:.6rem;overflow:hidden;background:var(--si-bg)}
.pv-screen .si-slide{position:absolute;inset:0;visibility:visible;opacity:1;transform:none;transition:none}
.pv-screen .si-inner{font-size:calc(var(--_u) * 1.7 * var(--si-scale));overflow:hidden}
.pv-screen .si-step{transition:none}
.pv.prompter-only{grid-template-columns:minmax(0,1fr)}
.pv.prompter-only .pv-side{display:none}
.pv-bar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;font-size:.9rem}
.pv-bar button{font:inherit;color:var(--si-fg);background:var(--si-surface);border:1px solid var(--si-line);border-radius:.45rem;padding:.4em .8em;cursor:pointer}
.pv-bar button:hover,.pv-bar button[aria-pressed="true"]{border-color:var(--si-accent)}
.pv-bar button[aria-pressed="true"]{color:var(--si-on-accent);background:var(--si-accent)}
.pv-bar .sep{width:1px;align-self:stretch;background:var(--si-line);margin:0 .2rem}
.pv-bar small{font-family:var(--si-font-mono);color:var(--si-muted)}
.pv-bar #rec[aria-pressed="true"]{color:#fff;background:#c62828;border-color:#c62828}
.pv-bar #rec[aria-pressed="true"]::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#fff;margin-right:.4em;animation:pv-rec 1s steps(2) infinite}
@keyframes pv-rec{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pv-bar #rec[aria-pressed="true"]::before{animation:none}}
.pv-keys{margin-left:auto;font-family:var(--si-font-mono);font-size:.72rem;color:var(--si-muted)}
@media (max-width:52rem),(orientation:portrait){
  .pv{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(40vh,1fr) auto auto;height:auto;min-height:100dvh}
  body{overflow:auto}
  .pv-side{flex-direction:row;overflow:visible}.pv-side>div{flex:1 1 0;min-width:0}
  .pv-keys{display:none}
}
/* phone (portrait or landscape): the script fills the screen, no previews, one compact clock line, big Prev / Next */
@media (max-width:40rem),(max-height:30rem){
  body{overflow:hidden}
  .pv{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100dvh;min-height:0;gap:.4rem;
    padding:max(.4rem,env(safe-area-inset-top)) max(.5rem,env(safe-area-inset-right)) max(.4rem,env(safe-area-inset-bottom)) max(.5rem,env(safe-area-inset-left))}
  .pv-side,.pv-bar .sep,#nmins,#lastpace,#slideplan,#planned,.pv-clocks>span:has(#clock){display:none}
  .pv-top{flex-wrap:nowrap;gap:.8rem;font-size:12px}
  .pv-top b{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:1.05em}
  #pos{white-space:nowrap}
  .pv-clocks{flex-wrap:nowrap;gap:.8rem;white-space:nowrap}.pv-clocks strong{font-size:1.25em}
  .pv-prompt-head{padding:.3rem .5rem}
  .pv-notes{padding:.8rem 1rem 40vh}
  .pv-bar{flex-wrap:nowrap;overflow-x:auto;gap:.3rem}
  .pv-bar button{flex:none;padding:.55em .7em}
  .pv-bar #prev,.pv-bar #nextb{flex:1 0 4.5rem;padding:.75em .5em;font-weight:700}
}
@media (max-width:40rem) and (orientation:portrait){
  .pv-top{flex-wrap:wrap;gap:.15rem .8rem}
  .pv-top b{flex-basis:100%}
  .pv-clocks{margin-left:0}
}
</style></head>
<body>
<div class="pv" id="pv">
  <div class="pv-top"><b id="title"></b><span id="pos"></span>
    <span class="pv-clocks">
      <span id="slideclock">slide <strong id="slideel">00:00</strong> <span id="slideplan"></span> <span id="rehearse" class="pv-rehearse"></span></span>
      <span id="mineclock" hidden><span id="minename"></span> <strong id="mine">00:00</strong> <span id="mineplan"></span></span>
      <span id="totalclock">total <strong id="elapsed">00:00</strong> <span id="planned"></span></span>
      <span class="pace" id="pace"></span>
      <span class="pace" id="lastpace"></span>
      <span>clock <strong id="clock"></strong></span>
    </span></div>
  <div class="pv-prompt" id="prompt"><div class="pv-prompt-head"><div class="pv-tabs"><button class="pv-tab" id="tab-tele" aria-pressed="true" title="Verbatim script (1)">Teleprompter</button><button class="pv-tab" id="tab-notes" aria-pressed="false" title="Talking points (2)">Speaker Notes</button><button class="pv-tab" id="tab-qa" aria-pressed="false" title="Questions from the room (3)" hidden>Q&amp;A</button></div><span id="nmins"></span><span id="scrollstate"></span></div><div class="pv-handover" id="handover" role="status"></div><div class="pv-notes" id="notes"></div><div class="pv-points" id="points" hidden></div><div class="pv-qa" id="qa" hidden></div></div>
  <div class="pv-side">
    <div><div class="pv-label">Now</div><div class="pv-screen" id="cur"></div></div>
    <div><div class="pv-label" id="label">Next</div><div class="pv-screen" id="next"></div></div>
  </div>
  <div class="pv-bar">
    <button id="prev" title="Previous (left, PgUp)">Prev</button><button id="nextb" title="Next (right, space, PgDn)">Next</button>
    <span class="sep"></span>
    <button id="auto" aria-pressed="false" title="Auto-scroll (a)">Auto-scroll</button><button id="slower" title="Slower (-)">&minus;</button><small id="speed"></small><button id="faster" title="Faster (+)">+</button>
    <span class="sep"></span>
    <button id="smaller" title="Smaller text ([)">A&minus;</button><button id="bigger" title="Bigger text (])">A+</button>
    <button id="mirror" aria-pressed="false" title="Mirror for teleprompter glass (m)">Mirror</button>
    <button id="only" aria-pressed="false" title="Notes only (x)">Notes only</button>
    <select id="speaker" title="Whose script (s)" aria-label="Speaker" hidden></select>
    <span class="sep"></span>
    <button id="timer" title="Pause or resume the timer (t)">Pause</button><button id="reset" title="Reset the timer (0)">Reset</button>
    <button id="rec" aria-pressed="false" title="Record your voice with the slide timings (Shift+R); saved beside the talk in .si/recordings/" hidden>● Record</button>
    <span class="pv-keys">&larr; &rarr; space: navigate · 1/2 tabs · &uarr; &darr;: scroll · a auto · +/- speed · [ ] size · m mirror · x notes only · s speaker</span>
  </div>
</div>
<script>
(function () {
  'use strict';
  var D = __DATA__;
  var $ = function (id) { return document.getElementById(id); };
  var pv = $('pv'), notes = $('notes'), points = $('points'), prompt = $('prompt');
  document.documentElement.style.setProperty('--_aspect', D.aspect);
  /* same-browser window: BroadcastChannel; remote device (si play --remote): the relay */
  var chan = D.relay && window.SI_RELAY ? window.SI_RELAY() : new BroadcastChannel('si:' + D.name);
  function send(cmd) {
    if (cmd !== 'hello' && blocked()) return; /* speakers.control: turn */
    chan.postMessage({ type: 'cmd', cmd: cmd, name: D.name, mid: Math.random().toString(36).slice(2) }); }
  function load(k, d) { try { var v = localStorage.getItem('si-prompter-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem('si-prompter-' + k, JSON.stringify(v)); } catch (e) {} }

  /* ---------- two presenters (speakers:): whose script, who speaks now, the hand-over ---------- */
  var speakers = D.speakers || [], speaking = '', rawNotes = '', rawPoints = '', hoT = 0;
  function speakerNamed(n) { n = (n || '').toLowerCase(); return speakers.filter(function (s) { return s.toLowerCase() === n; })[0] || ''; }
  var qsp = /[?&]speaker=([^&#]*)/.exec(location.search);
  var me = speakerNamed(qsp ? decodeURIComponent(qsp[1].replace(/\+/g, ' ')) : load('speaker', ''));
  if (speakers.length) {
    var sel = $('speaker');
    [''].concat(speakers).forEach(function (n) { var o = document.createElement('option'); o.value = n; o.textContent = n || 'Everyone'; sel.appendChild(o); });
    sel.value = me; sel.hidden = false;
    sel.onchange = function () { pickSpeaker(sel.value); sel.blur(); };
  }
  function pickSpeaker(n) { me = n; save('speaker', me); $('speaker').value = me; script(); tick(); }
  function blocked() { return !!(D.turn && me && speaking && speaking !== me); }
  function voicesOf(h) { var t = document.createElement('div'); t.innerHTML = h || ''; return Array.prototype.filter.call(t.children, function (e) { return e.classList.contains('si-voice'); }); }
  function firstWords(el) { Array.prototype.forEach.call(el.querySelectorAll(".si-cue"), function (c) { c.remove(); }); var w = (el.textContent || "").replace(/\s+/g, " ").trim().split(" "); return w.slice(0, 8).join(" ") + (w.length > 8 ? " …" : ""); }
  function who(el, text) { var d = document.createElement('div'); d.className = 'pv-who'; d.textContent = text; el.appendChild(d); }
  function script() {
    var vs = voicesOf(rawNotes), ps = voicesOf(rawPoints), mine = 0;
    if (!vs.length) notes.innerHTML = rawNotes || '<p><em>No notes for this slide.</em></p>';
    else {
      notes.textContent = '';
      vs.forEach(function (v) {
        var name = v.getAttribute('data-speaker'), mins = parseFloat(v.getAttribute('data-minutes')) || 0, part = document.createElement('div');
        part.className = 'pv-part'; part.setAttribute('data-who', name); part.setAttribute('data-step', v.getAttribute('data-step') || '0');
        if (name === me) mine += mins;
        if (!me || name === me) {
          if (!me) who(part, name + (mins ? ' · ' + fmt(mins * 60000) : ''));
          part.insertAdjacentHTML('beforeend', v.innerHTML);
        } else { /* someone else's lines: who, how long, their first words (your cue) */
          part.className += ' pv-other';
          var b = document.createElement('b'); b.textContent = name + (mins ? ' ' + fmt(mins * 60000) : '');
          part.appendChild(b); part.appendChild(document.createTextNode('“' + firstWords(v) + '”'));
        }
        notes.appendChild(part);
      });
    }
    if (!ps.length) points.innerHTML = rawPoints || '<p><em>No speaker notes for this slide.</em></p>';
    else {
      points.textContent = '';
      ps.forEach(function (v) {
        var name = v.getAttribute('data-speaker');

        points.insertAdjacentHTML('beforeend', v.innerHTML);
      });
      if (!points.children.length) points.innerHTML = '<p><em>No speaker notes for you on this slide.</em></p>';

    var m = $('nmins').getAttribute('data-n');
    if (m) $('nmins').textContent = 'Notes, slide ' + m + (me && vs.length ? ' · ' + me + ' ' + (mine ? fmt(mine * 60000) : 'listens') : '');
    turn();
  }
  /* who speaks now: the part whose first build step is this one, else the last one begun */
  function turn() {
    var parts = notes.querySelectorAll('.pv-part'), at = null;
    Array.prototype.forEach.call(parts, function (p) { var s = +p.getAttribute('data-step'); if (s < curStep || (s === curStep && !(at && +at.getAttribute('data-step') === curStep))) at = p; });
    Array.prototype.forEach.call(parts, function (p) { p.classList.toggle('is-now', p === at); });
    var w = at ? at.getAttribute('data-who') : '';
    if (w && w !== speaking) {
      if (speaking) { /* the hand-over: both teleprompters show it for a few seconds */
        var h = $('handover'); h.textContent = '→ ' + w + (w === me ? ' (you)' : '');
        h.classList.add('on'); clearTimeout(hoT); hoT = setTimeout(function () { h.classList.remove('on'); }, 4000);
      }
      speaking = w;
    }
    $('prev').disabled = $('nextb').disabled = blocked();
  }

  /* ---------- teleprompter settings ---------- */
  var size = load('size', 1), speed = load('speed', 4), mirror = load('mirror', false), only = load('only', false), auto = false;
  function settings() {
    pv.style.setProperty('--pv-size', size);
    pv.classList.toggle('mirror', mirror); $('mirror').setAttribute('aria-pressed', mirror);
    pv.classList.toggle('prompter-only', only); $('only').setAttribute('aria-pressed', only);
    $('auto').setAttribute('aria-pressed', auto);
    $('speed').textContent = 'speed ' + speed;
    $('scrollstate').textContent = auto ? 'auto-scroll ' + speed : 'manual scroll';
    save('size', size); save('speed', speed); save('mirror', mirror); save('only', only);
  }
  /* ---------- prompt tabs: teleprompter (verbatim) vs speaker notes (points) ---------- */
  var tab = load('tab', 'tele'); // 'tele' or 'notes'
  function showTab(t) {
    if (t === 'qa' && $('tab-qa').hidden) t = 'tele';
    tab = t; save('tab', tab === 'qa' ? 'tele' : tab);
    var tele = tab === 'tele';
    notes.hidden = !tele; points.hidden = tab !== 'notes'; $('qa').hidden = tab !== 'qa';
    prompt.classList.toggle('points', !tele);
    $('tab-tele').setAttribute('aria-pressed', tele);
    $('tab-notes').setAttribute('aria-pressed', tab === 'notes');
    $('tab-qa').setAttribute('aria-pressed', tab === 'qa');
  }
  /* ---------- Q&A (si play --audience): questions from the room ---------- */
  function qaSet(id, state) {
    try { fetch('/_si/qa', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, state: state }) }); } catch (e) {}
  }
  /* the room's words (word clouds): Hide takes one off every screen */
  var clouds = {}, lastQA = [];
  function cloudWords(m) { clouds[m.id] = m; qaShow(lastQA); }
  function cloudHide(id, w, hide) {
    try { fetch('/_si/cloud', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cloud: id, word: w, hide: hide }) }); } catch (e) {}
  }
  function qaShow(list) {
    lastQA = list || [];
    var box = $('qa'), open = 0, words = 0;
    box.textContent = '';
    Object.keys(clouds).forEach(function (id) {
      var m = clouds[id], el = document.createElement('div'); el.className = 'pv-q pv-words';
      var h = document.createElement('small'); h.textContent = 'Words · ' + id + ' · ' + (m.total || 0) + ' answered'; el.appendChild(h);
      (m.words || []).concat(m.hidden || []).forEach(function (w) {
        words++;
        var off = (m.hidden || []).indexOf(w) >= 0, b = document.createElement('button'); b.type = 'button';
        b.textContent = w.w + ' ' + w.n + (off ? ' · show' : ' · hide'); b.setAttribute('aria-pressed', off ? 'true' : 'false');

    });

      if (q.state === 'hidden') return;
      if (q.state !== 'answered') open++;
      var el = document.createElement('div'); el.className = 'pv-q'; el.setAttribute('data-state', q.state);
      var p = document.createElement('p'); p.textContent = q.text; el.appendChild(p);
      var who = document.createElement('small'); who.textContent = (q.name ? q.name + ' · ' : '') + (q.state === 'shown' ? 'on screen' : q.state); el.appendChild(who);
      var btn = function (label, state) { var b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = function () { qaSet(q.id, state); }; el.appendChild(b); };
      if (q.state === 'shown') btn('Off screen', 'open'); else btn('Show on screen', 'shown');
      if (q.state !== 'answered') btn('Answered', 'answered');
      btn('Hide', 'hidden');
      box.appendChild(el);
    });
    var t = $('tab-qa');
    t.hidden = !((list && list.length) || words);
    t.textContent = 'Q&A' + (open ? ' (' + open + ')' : '');
  }
  function activePane() { return tab === 'tele' ? notes : points; }
  /* auto-scroll: speed 1..10, in lines per ten seconds, so it follows the text size */
  var lastT = 0, carry = 0;
  function frame(t) {
    if (auto) {
      var dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0;
      var line = parseFloat(getComputedStyle(notes).fontSize) * 1.5;
      carry += speed * 0.1 * line * dt;

    }
    lastT = t;
    requestAnimationFrame(frame);
  }

  var start = Date.now(), paused = 0, pausedAt = 0, slideStart = Date.now(), cur = -1, curStep = 0, plan = [], total = 0;
  /* rehearsal: actual time spent per slide this run (persisted), and the prior run for reference */
  var prevSpent = load('rehearse-' + D.name, []), spent = [];
  function now() { return pausedAt || Date.now(); }
  function fmt(ms) { var neg = ms < 0, s = Math.floor(Math.abs(ms) / 1000); return (neg ? '-' : '') + pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function pad(x) { return (x < 10 ? '0' : '') + x; }
  /* ---------- Record your talk (si play): the microphone in chunks, a mark per view ---------- */
  var rec = null, recT0 = 0, recQ = Promise.resolve(), recView = null;
  function recPost(p, body, type) { return fetch('/_si/record/' + p, { method: 'POST', headers: { 'Content-Type': type || 'application/json' }, body: body }); }
  function recT() { return Math.round((Date.now() - recT0) / 10) / 100; } /* audio time: the talk timer may be paused */
  function recMark(i, k) {
    if (!rec) return;
    recView = [i, k];
    recQ = recQ.then(function () { return recPost('mark', JSON.stringify({ t: recT(), slide: i, step: k })); }).catch(function () {});
  }
  function recStart() {
    var types = [['audio/webm;codecs=opus', 'webm'], ['audio/mp4', 'm4a'], ['audio/ogg;codecs=opus', 'ogg']], pick = null;
    for (var i = 0; i < types.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(types[i][0])) { pick = types[i]; break; }
    if (!pick || !navigator.mediaDevices) { $('rec').title = 'This browser cannot record audio here'; return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      return recPost('start', JSON.stringify({ path: D.path, ext: pick[1] })).then(function (r) {
        if (!r.ok) throw new Error('start ' + r.status);
        rec = new MediaRecorder(stream, { mimeType: pick[0] });
        rec.ondataavailable = function (e) { if (e.data && e.data.size) recQ = recQ.then(function () { return recPost('chunk', e.data, 'application/octet-stream'); }).catch(function () {}); };
        rec.onstop = function () {
          var t = recT();
          stream.getTracks().forEach(function (tr) { tr.stop(); });
          setTimeout(function () { recQ = recQ.then(function () { return recPost('stop', JSON.stringify({ t: t })); }).then(function (r) { return r.json(); }).then(function (m) { $('rec').title = 'Saved in ' + m.dir; }).catch(function () {}); }, 50);
          rec = null; $('rec').setAttribute('aria-pressed', 'false'); $('rec').textContent = '● Record';
        };
        recT0 = Date.now(); rec.start(2000);
        $('rec').setAttribute('aria-pressed', 'true');
        if (cur >= 0) recMark(cur, curStep);
      });
    }).catch(function (e) { $('rec').title = 'Could not record: ' + e.message; });
  }
  function recToggle() { if (rec) rec.stop(); else recStart(); }
  if (D.path && !D.relay) fetch('/_si/record').then(function (r) { if (r.ok) $('rec').hidden = false; }).catch(function () {});
  $('rec').onclick = recToggle;

  var mineMs = 0, lastTick = Date.now();
  function tick() {
    if (rec) $('rec').textContent = 'Stop ' + fmt(Date.now() - recT0);
    /* your own clock (speakers:): the time while it is your turn, against your planned minutes */
    var t0 = Date.now();
    if (!pausedAt && me && speaking === me) mineMs += t0 - lastTick;
    lastTick = t0;
    $('mineclock').hidden = !me;
    if (me) {
      var mp = (D.speakerMinutes || {})[me] || 0;
      $('minename').textContent = me; $('mine').textContent = fmt(mineMs); $('mineplan').textContent = mp ? '/ ' + mp + ' min' : '';
    }
    var el = now() - start - paused, sl = now() - slideStart;
    $('elapsed').textContent = fmt(el);
    $('slideel').textContent = fmt(sl);
    var mins = plan[cur] || 0;
    $('slideclock').className = mins && sl > mins * 90000 ? 'late' : (mins && sl > mins * 60000 ? 'over' : '');
    $('totalclock').className = total && el > total * 60000 ? 'late' : '';
    if (total && cur >= 0) {
      var due = 0; for (var i = 0; i < cur; i++) due += plan[i] || 0;
      var diff = el - Math.min(sl, mins * 60000) - due * 60000;
      $('pace').textContent = Math.abs(diff) < 15000 ? 'on time' : (diff > 0 ? fmt(diff) + ' behind' : fmt(-diff) + ' ahead');
    }
    var d = new Date(); $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var prev = cur >= 0 ? prevSpent[cur] : 0;
    $('rehearse').textContent = prev ? 'last ' + fmt(prev) : '';
    /* the whole talk against the last run: where it was by the end of this slide */
    var ref = 0; for (var j = 0; j < cur; j++) ref += prevSpent[j] || 0;
    var d2 = el - Math.min(sl, prev || 0) - ref;
    $('lastpace').textContent = cur >= 0 && prevSpent.length ? 'vs last run ' + (Math.abs(d2) < 15000 ? 'on pace' : (d2 > 0 ? fmt(d2) + ' behind' : fmt(-d2) + ' ahead')) : '';
  }
  function toggleTimer() {
    if (pausedAt) { paused += Date.now() - pausedAt; slideStart += Date.now() - pausedAt; pausedAt = 0; $('timer').textContent = 'Pause'; }
    else { pausedAt = Date.now(); $('timer').textContent = 'Resume'; }
    tick();
  }
  function resetTimer() { start = slideStart = Date.now(); paused = 0; mineMs = 0; if (pausedAt) pausedAt = Date.now(); prevSpent = spent.slice(); spent = []; tick(); }
  setInterval(tick, 250);

  /* ---------- sync with the audience window ---------- */
  chan.onmessage = function (e) {
    var m = e.data || {};
    if (m.type === 'questions') { qaShow(m.list); return; }
    if (m.type === 'cloud') { cloudWords(m); return; }
    if (m.type !== 'state' || (m.name && m.name !== D.name)) return;
    plan = m.plan || plan; total = m.total || 0;
    document.documentElement.setAttribute('data-si-mode', m.dark ? 'dark' : 'light');
    $('title').textContent = m.title || D.title;
    $('pos').textContent = 'slide ' + (m.i + 1) + ' / ' + m.n + (m.kmax ? '  ·  step ' + m.k + ' / ' + m.kmax : '');
    $('slideplan').textContent = m.minutes ? '/ ' + m.minutes + ' min' : '';
    $('planned').textContent = total ? '/ ' + total + ' min' : '';
    $('cur').innerHTML = m.cur;
    $('next').innerHTML = m.next || '';
    $('label').textContent = m.label;
    curStep = m.k || 0;
    if (rec && (!recView || recView[0] !== m.i || recView[1] !== curStep)) recMark(m.i, curStep);
    if (m.i !== cur) {
      if (cur >= 0) { spent[cur] = (spent[cur] || 0) + (now() - slideStart); save('rehearse-' + D.name, spent); }
      cur = m.i; slideStart = now();
      rawNotes = m.notes || ''; rawPoints = m.points || '';
      $('nmins').setAttribute('data-n', (m.i + 1) + (m.minutes ? ' · ' + m.minutes + ' min' : ''));
      script();
      notes.scrollTop = 0; points.scrollTop = 0; carry = 0;
    }
    turn();
    tick();
  };

  /* ---------- controls: buttons and keys drive both windows ---------- */
  $('prev').onclick = function () { send('prev'); };
  $('nextb').onclick = function () { send('next'); };
  $('auto').onclick = function () { auto = !auto; settings(); };
  $('slower').onclick = function () { speed = Math.max(1, speed - 1); settings(); };
  $('faster').onclick = function () { speed = Math.min(10, speed + 1); settings(); };
  $('smaller').onclick = function () { size = Math.max(0.6, +(size - 0.1).toFixed(2)); settings(); };
  $('bigger').onclick = function () { size = Math.min(2.5, +(size + 0.1).toFixed(2)); settings(); };
  $('mirror').onclick = function () { mirror = !mirror; settings(); };
  $('only').onclick = function () { only = !only; settings(); };
  $('timer').onclick = toggleTimer;
  $('reset').onclick = resetTimer;
  $('tab-tele').onclick = function () { showTab('tele'); };
  $('tab-notes').onclick = function () { showTab('notes'); };
  $('tab-qa').onclick = function () { showTab('qa'); };
  Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) { b.addEventListener('click', function () { b.blur(); }); });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key) {
      case 'ArrowRight': case 'PageDown': case 'Enter': case 'n': e.preventDefault(); send('next'); break;
      case ' ': e.preventDefault(); send(e.shiftKey ? 'prev' : 'next'); break;
      case 'ArrowLeft': case 'PageUp': case 'Backspace': case 'p': e.preventDefault(); send('prev'); break;
      case 'ArrowDown': e.preventDefault(); activePane().scrollTop += activePane().clientHeight * 0.15; break;
      case 'ArrowUp': e.preventDefault(); activePane().scrollTop -= activePane().clientHeight * 0.15; break;
      case 'Home': e.preventDefault(); send('first'); break;
      case 'End': e.preventDefault(); send('last'); break;
      case 'a': auto = !auto; settings(); break;
      case '+': case '=': speed = Math.min(10, speed + 1); settings(); break;
      case '-': case '_': speed = Math.max(1, speed - 1); settings(); break;
      case ']': size = Math.min(2.5, +(size + 0.1).toFixed(2)); settings(); break;
      case '[': size = Math.max(0.6, +(size - 0.1).toFixed(2)); settings(); break;
      case 'm': mirror = !mirror; settings(); break;
      case 'x': only = !only; settings(); break;
      case 's': if (speakers.length) { var ix = [''].concat(speakers).indexOf(me); pickSpeaker([''].concat(speakers)[(ix + 1) % (speakers.length + 1)]); } break;
      case 'r': activePane().scrollTop = 0; break;
      case 'R': if (!$('rec').hidden) recToggle(); break;
      case '1': showTab('tele'); break;
      case '2': showTab('notes'); break;
      case '3': showTab('qa'); break;
      case 't': toggleTimer(); break;
      case '0': resetTimer(); break;
    }
  });
  settings(); showTab(tab); tick();
  send('hello');
})();
</script>
</body></html>
