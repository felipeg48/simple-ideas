name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-s -w" -o "dist/si_${GITHUB_REF_NAME}_${os}_${arch}${ext}" ./cmd/si
          done
      - name: Linux packages (.deb, .rpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          mkdir -p build
          for arch in amd64 arm64; do
            cp "dist/si_${GITHUB_REF_NAME}_linux_${arch}" build/si
            for f in deb rpm; do VERSION="${GITHUB_REF_NAME#v}" ARCH="$arch" nfpm pkg -f packaging/nfpm.yaml -p "$f" -t dist/; done
          done
          (cd dist && shasum -a 256 si_* simple-ideas* > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "si $GITHUB_REF_NAME" --generate-notes

  desktop-macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build si Studio.app
        run: desktop/build-mac.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop/dist/si-Studio-*-macos.zip

  # felipeg48/homebrew-tap: Formula/si.rb and Casks/si-studio.rb for this release.
  # Needs the HOMEBREW_TAP_TOKEN secret (a token that can write that repo); without it, skipped.
  homebrew:
    needs: desktop-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::notice::HOMEBREW_TAP_TOKEN is not set: the Homebrew tap is not updated"; exit 0; fi
          v="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt -p "si-Studio-$v-macos.zip" -D rel
          git clone "https://x-access-token:$TAP_TOKEN@github.com/felipeg48/homebrew-tap.git" tap
          packaging/homebrew.sh "$v" rel/SHA256SUMS.txt "$(shasum -a 256 "rel/si-Studio-$v-macos.zip" | cut -d' ' -f1)" tap
          cd tap
          git config user.name "simple-ideas release"
          git config user.email "felipeg48@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "si $v"; git push; }
