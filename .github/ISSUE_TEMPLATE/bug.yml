name: Report a problem
description: Something in si does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: "`si --version`, or Help ▸ About in the Studio."
      placeholder: "2.5.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where
      options:
        - CLI
        - si play (browser)
        - web Studio
        - desktop app
        - terminal
        - built page
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and browser
      placeholder: "macOS 26.1, Chrome 140"
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. si build talk.md
        2. open talk.html, go to slide 3
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: markdown
    attributes:
      label: The Markdown that shows it
      description: The smallest piece of the file that shows the problem.
      render: markdown
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drop images here.
